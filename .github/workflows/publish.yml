name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Stages the package on npm with trusted publishing (OIDC). No npm token is stored.
  # A maintainer must approve the staged version on npmjs.com before it is public.
  # The npm-publish environment requires manual approval before this job starts.
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm stage publish
